<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Northwind — Arc UI Analytics</title>
    <script>
      // Set theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem("arc-theme");
          if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.dataset.theme = t;
          var a = localStorage.getItem("arc-accent");
          document.documentElement.dataset.accent = a || "violet";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
          document.documentElement.dataset.accent = "violet";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
